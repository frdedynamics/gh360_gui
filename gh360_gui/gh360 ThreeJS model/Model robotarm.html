<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html, body {
            margin: 0;                /* remove default 8px margins */
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;        /* prevent scrollbars inside iframe */
            box-sizing: border-box;
            background: #fff;        /* match parent background if desired */
        }

        /* Make the main container/canvas fill the whole iframe */
        #root, .app, canvas, #threejs-canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            box-sizing: border-box;
        }

        /* Defensive: hide any unexpected range scrollbars or GUI panels */
        input[type="range"], .slider, .scroll-container {
            display: none !important;
        }

        /* If using dat.GUI */
        .dg { display: none !important; }
    </style>

    <meta charset="UTF-8">
    <title>Robotarm model</title>
    <!-- Fetching the library for the loader used by ROS, as well as ThreeJS from the net -->
    <script type="importmap">
             { "imports":
                {
                    "urdf-loader":  "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/+esm",
                    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/+esm"
                }
             }
    </script>
</head>
<body>
<script type="module" src="./js/main.js"></script>
</body>
</html>
